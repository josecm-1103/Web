    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pétalos Cayendo</title>
    <style>
        body {
            background-color: #ffe6f2;
            margin: 0;
            overflow: hidden;
            position: relative;
        }

        .petalo {
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: pink;
            opacity: 0.8;
            border-radius: 50% 60% 60% 50%;
            transform: rotate(45deg);
            box-shadow: inset 2px -2px 5px rgba(0, 0, 0, 0.2);
        }

        @keyframes caer {
            0% { transform: translateY(-50px) rotate(0deg); }
            100% { transform: translateY(100vh) rotate(360deg); }
        }
    </style>

    <script>
        function crearPetalo() {
            const petalo = document.createElement("div");
            petalo.classList.add("petalo");

            // Posición inicial aleatoria en la parte superior
            petalo.style.left = Math.random() * window.innerWidth + "px";
            petalo.style.top = "-50px";

            // Tamaño aleatorio
            let size = Math.random() * 15 + 10;
            petalo.style.width = size + "px";
            petalo.style.height = size + "px";

            // Opacidad aleatoria
            petalo.style.opacity = Math.random() * 0.5 + 0.5;

            // Animación con duración aleatoria
            let duracion = Math.random() * 5 + 3;
            petalo.style.animation = `caer ${duracion}s linear infinite`;

            document.body.appendChild(petalo);

            // Eliminar pétalo después de caer
            setTimeout(() => {
                petalo.remove();
            }, duracion * 1000);
        }

        // Generar pétalos continuamente
        setInterval(crearPetalo, 300);
    </script>

</body>
