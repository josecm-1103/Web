<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rosas Animadas</title>
    <style>
        /* Estilo general */
        body {
            background-color: #ffe6f2;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            position: relative;
        }

        /* Contenedor para rosas animadas */
        .falling-roses {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }

        /* Animación de caída */
        @keyframes fall {
            0% {
                transform: translateY(-10%) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(110%) rotate(360deg);
                opacity: 0;
            }
        }

        /* Diseño de las rosas */
        .rose {
            position: absolute;
            width: 40px;
            animation: fall 8s linear infinite;
        }

        /* Variaciones de las rosas */
        .rose:nth-child(1) {
            left: 10%;
            animation-duration: 7s;
            animation-delay: 0s;
        }
        .rose:nth-child(2) {
            left: 30%;
            animation-duration: 9s;
            animation-delay: 2s;
        }
        .rose:nth-child(3) {
            left: 50%;
            animation-duration: 6s;
            animation-delay: 1s;
        }
        .rose:nth-child(4) {
            left: 70%;
            animation-duration: 10s;
            animation-delay: 3s;
        }
        .rose:nth-child(5) {
            left: 90%;
            animation-duration: 8s;
            animation-delay: 4s;
        }
    </style>
</head>
<body>
    <div class="falling-roses">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz San Valentín</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #ffe6f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .frame {
            border: 15px solid pink;
            padding: 20px;
            position: relative;
            width: 80%;
            height: 80%;
            box-sizing: border-box;
            text-align: center;
        }

        h1 {
            font-family: 'Brush Script MT', cursive;
            font-size: 4em;
            color: #d10068;
            animation: glow 1.5s infinite alternate;
            position: relative;
            z-index: 2;
        }

        @keyframes glow {
            0% { text-shadow: 0 0 5px #d10068; }
            100% { text-shadow: 0 0 20px #ff1493; }
        }

        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 15px 30px;
            font-size: 1.5em;
            color: white;
            background: linear-gradient(45deg, #d10068, #ff1493);
            border: none;
            border-radius: 15px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .button:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
        }

        .heart {
            position: absolute;
            width: 25px;
            height: 25px;
            background-color: pink;
            transform: rotate(-45deg);
            animation: fall 6s linear infinite;
            z-index: 1;
        }

        .heart::before,
        .heart::after {
            content: '';
            position: absolute;
            width: 25px;
            height: 25px;
            background-color: pink;
            border-radius: 50%;
        }

        .heart::before {
            top: -12.5px;
            left: 0;
        }

        .heart::after {
            left: -12.5px;
            top: 0;
        }

        @keyframes fall {
            0% {
                transform: translateY(-100px) rotate(-45deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(45deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="frame">
        <h1>Feliz San Valentín!❤️</h1>
        <a class="button" href="carta.html" target="_blank"><em>𝕊𝕚𝕘𝕦𝕚𝕖𝕟𝕥𝕖</em></a>
    </div>

    <script>
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.style.left = Math.random() * window.innerWidth + 'px';
            heart.style.animationDuration = Math.random() * 3 + 4 + 's';
            heart.style.opacity = Math.random();
            document.body.appendChild(heart);

            setTimeout(() => heart.remove(), 6000);
        }

        setInterval(createHeart, 100);
    </script>
</body>
</html>
